resources:
  jobs:
    sales_pipeline_job:
      name: sales-pipeline-job
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
      tasks:
        - task_key: generate_data
          description: "Create hardcoded sales dataset and write to Delta"
          notebook_task:
            notebook_path: ./src/notebooks/01_generate_data
            source: WORKSPACE
          environment_key: default
        - task_key: summarize_data
          description: "Read Delta table and compute aggregations"
          depends_on:
            - task_key: generate_data
          notebook_task:
            notebook_path: ./src/notebooks/02_summarize_data
            source: WORKSPACE
          environment_key: default
      environments:
        - environment_key: default
          spec:
            environment_version: "4"
