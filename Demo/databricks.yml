# This is a Databricks asset bundle definition for Demo.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: Demo
  uuid: 81236f91-8749-4b0a-8253-b653d4c3d5cc

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-edeb68e3-629e.cloud.databricks.com
    variables:
      catalog: workspace
      schema: ${workspace.current_user.short_name}
  prod:
    mode: production
    workspace:
      host: https://dbc-edeb68e3-629e.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/munizah84@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/munizah84@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: workspace
      schema: prod
    permissions:
      - user_name: munizah84@gmail.com
        level: CAN_MANAGE
